<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>좌석 관리 · 판교2테크노밸리점</title><link rel="stylesheet" href="../admin.css?v=43.7.1.1"><link rel="stylesheet" href="../seats.css?v=43.7.1.3"><link rel="stylesheet" href="../seats-mobile.css?v=43.7.1.1"><link rel="stylesheet" href="../bottle-seat-policy.css?v=1"><link rel="stylesheet" href="../seat-layout.css?v=1"></head><body>

<header class="admin-header"><div><h1>🪑 좌석 관리</h1><p>파파존스 판교2테크노밸리점</p></div><div class="admin-tools"><a class="sound-settings-button" href="../admin/">← 주문 관리</a><span id="seatConnection" class="connection">연결 중</span></div></header>
<main class="seat-admin-main seat-admin-cad">
<section class="cad-topbar">
  <div><h2>매장 좌석 현황</h2><p>전체 좌석을 한 화면에서 관리합니다.</p></div>
  <div class="seat-top-actions"><div id="seatSummary" class="seat-summary cad-summary"></div><div id="seatLayoutActions" class="seat-layout-actions"><button type="button" id="editSeatLayout" aria-label="좌석 배열 수정">좌석 배열 수정</button><button type="button" id="saveSeatLayout" hidden>저장</button><button type="button" id="reloadSeatLayout" hidden>최신 배열 다시 불러오기</button><button type="button" id="cancelSeatLayout" hidden>취소</button><button type="button" id="resetSeatLayout" hidden>기본 배열로 되돌리기</button></div></div>
</section>
<div id="seatLayoutNotice" class="seat-layout-notice" role="status" aria-live="polite" hidden></div>
<section id="seatAdmin" class="cad-layout"></section>
</main>
<dialog id="seatOccupancyDialog" class="seat-occupancy-dialog" aria-labelledby="seatOccupancyDialogTitle" aria-describedby="seatOccupancyDialogDescription">
  <form method="dialog">
    <h2 id="seatOccupancyDialogTitle">좌석 사용 시작</h2>
    <p id="seatOccupancyDialogDescription">선택한 좌석을 사용중으로 변경하시겠습니까?</p>
    <div class="seat-occupancy-dialog-actions">
      <button type="button" data-seat-occupancy-cancel>취소</button>
      <button type="button" class="confirm" data-seat-occupancy-confirm>확인</button>
    </div>
  </form>
</dialog>
<dialog id="occupiedSeatDialog" class="seat-occupancy-dialog" aria-labelledby="occupiedSeatDialogTitle" aria-describedby="occupiedSeatDialogDescription">
  <form method="dialog">
    <h2 id="occupiedSeatDialogTitle">사용중 좌석</h2>
    <p id="occupiedSeatDialogDescription">원하는 작업을 선택하세요.</p>
    <div class="seat-occupancy-dialog-actions occupied-seat-dialog-actions">
      <button type="button" data-occupied-seat-cancel>취소</button>
      <button type="button" class="confirm" data-occupied-seat-order>주문관리 이동</button>
      <button type="button" data-occupied-seat-clear>사용가능으로 변경</button>
    </div>
  </form>
</dialog>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="../firebase-config.js?v=43.7.1.1"></script><script src="../bottle-seat-policy.js?v=1"></script><script src="../seat-layout.js?v=1"></script><script src="../seats.js?v=44.0.1"></script></body></html>
