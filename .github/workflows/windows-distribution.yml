name: Windows distribution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-distribution.yml"
      - "desktop/**"
      - "styles/**"
      - "scripts/verify-*-layout.js"
      - "scripts/verify-mobile-order-pizza-grid.js"
      - "tests/**"
      - "scripts/verify-windows-pe.js"
      - "scripts/verify-windows-update-artifacts.js"
      - "package.json"
      - "package-lock.json"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Preserve repository LF line endings
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --force --all

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: windows-electron-builder-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: windows-electron-builder-${{ runner.arch }}-

      - run: npm ci
      - name: Run test suite
        id: tests
        continue-on-error: true
        run: npm test -- --test-concurrency=1

      - name: Capture Windows layout diagnostics
        if: steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-layout | Out-Null
          $env:MOBILE_PIZZA_GRID_OUTPUT = "artifacts/windows-layout/mobile-pizza-grid"
          $env:MOBILE_PIZZA_GRID_REPORT = "artifacts/windows-layout/mobile-pizza-grid.json"
          & node_modules/.bin/electron.cmd scripts/verify-mobile-order-pizza-grid.js --screenshots
          $env:PIZZA_OPTION_REPORT = "artifacts/windows-layout/pizza-options.json"
          $env:PIZZA_OPTION_SCREENSHOT_DIR = "artifacts/windows-layout/pizza-options"
          & node_modules/.bin/electron.cmd scripts/verify-pizza-option-layout.js --screenshots
          $env:ORDER_REVIEW_REPORT = "artifacts/windows-layout/order-review.json"
          $env:ORDER_REVIEW_SCREENSHOT_DIR = "artifacts/windows-layout/order-review"
          & node_modules/.bin/electron.cmd scripts/verify-order-review-layout.js --screenshots

      - name: Upload Windows layout diagnostics
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-layout-diagnostics
          if-no-files-found: error
          path: artifacts/windows-layout/

      - name: Enforce test gate
        if: steps.tests.outcome == 'failure'
        shell: pwsh
        run: throw "Test suite failed; packaging remains blocked."

      - name: Build Windows ia32 NSIS update channel
        run: npx electron-builder --win nsis --ia32 --publish never --config.publish.channel=latest-ia32
      - run: npm run verify:win:ia32
      - name: Verify Windows ia32 update artifacts
        run: node scripts/verify-windows-update-artifacts.js ia32

      - name: Record Authenticode status and stage exactly three artifacts
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = @(
            "PapaJohns-Kiosk-Setup-$version-ia32.exe",
            "PapaJohns-Kiosk-Setup-$version-ia32.exe.blockmap",
            "latest-ia32.yml"
          )
          $topLevel = @(Get-ChildItem dist -File)
          $unexpected = @($topLevel | Where-Object { $_.Name -match '(?i)portable|x64' -or ($_.Extension -eq '.exe' -and $_.Name -ne $expected[0]) })
          if ($unexpected.Count -ne 0) { throw "Unexpected Windows artifacts: $($unexpected.Name -join ', ')" }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          foreach ($name in $expected) {
            $source = Join-Path dist $name
            if (-not (Test-Path $source -PathType Leaf)) { throw "Missing artifact: $name" }
            Copy-Item $source release-assets/$name
          }
          $assets = @(Get-ChildItem release-assets -File)
          if ($assets.Count -ne 3 -or @(Compare-Object $expected $assets.Name).Count -ne 0) { throw "Artifact bundle must contain exactly the three expected files." }
          Write-Host "The Setup EXE is an NSIS bootstrapper; PE Machine 0x014c is asserted on the packaged app executable inside win-ia32-unpacked."
          Get-AuthenticodeSignature (Join-Path dist $expected[0]) | Format-List Status,StatusMessage,SignerCertificate

      - name: Upload Windows ia32 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: papa-johns-kiosk-windows-ia32
          if-no-files-found: error
          path: release-assets/
