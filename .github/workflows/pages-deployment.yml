name: Pages deployment

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Pages source
        uses: actions/checkout@v4

      - name: Verify administrator assets
        shell: bash
        run: |
          test -f admin.js
          test -f admin.css
          test -f admin/index.html
          grep -Fq '../admin.css' admin/index.html
          grep -Fq '../admin.js' admin/index.html

      - name: Upload repository root
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
