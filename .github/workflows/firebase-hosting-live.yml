name: Firebase Hosting live

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_PAPAJOHNS_KIOSK_LIVE to authorize the live deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      deploy_enabled: ${{ steps.deployment-eligibility.outputs.enabled }}
    steps:
      - name: Validate live deployment confirmation
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "::error::Firebase live deployment may only be dispatched from refs/heads/main."
            exit 1
          fi
          if [[ "$DEPLOY_CONFIRMATION" != "DEPLOY_PAPAJOHNS_KIOSK_LIVE" ]]; then
            echo "::error::Live deployment confirmation did not match DEPLOY_PAPAJOHNS_KIOSK_LIVE."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          ELECTRON_DISABLE_SANDBOX: "true"
        run: |
          node node_modules/electron/install.js
          xvfb-run --auto-servernum npm test

      - name: Prepare Firebase Hosting files
        run: npm run build:hosting

      - name: Verify Firebase Hosting files
        run: npm run test:hosting

      - name: Upload verified Firebase Hosting artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firebase-hosting-live-${{ github.run_id }}
          path: .firebase-hosting/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Check live deployment eligibility
        id: deployment-eligibility
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_LIVE_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_LIVE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$WORKLOAD_IDENTITY_PROVIDER" || -z "$DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "::notice::Firebase live deployment is skipped because GCP_LIVE_WORKLOAD_IDENTITY_PROVIDER or GCP_FIREBASE_LIVE_DEPLOY_SERVICE_ACCOUNT is not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  deploy_live:
    if: needs.build_and_test.outputs.deploy_enabled == 'true'
    needs: build_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-hosting-live
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified Firebase Hosting artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firebase-hosting-live-${{ github.run_id }}
          path: .firebase-hosting

      - name: Validate downloaded static artifact
        run: |
          test "$(find . -mindepth 1 -maxdepth 1 -print | wc -l)" -eq 1
          test -d .firebase-hosting
          test -z "$(find .firebase-hosting -type l -print -quit)"
          test -z "$(find .firebase-hosting ! -type f ! -type d -print -quit)"
          test -f .firebase-hosting/index.html
          test -f .firebase-hosting/admin/index.html
          test -f .firebase-hosting/admin.css
          test -f .firebase-hosting/admin.js
          test -z "$(find .firebase-hosting -type f \( -name firebase.json -o -name .firebaserc -o -name firestore.rules -o -name package.json \) -print -quit)"

      - name: Create hook-free Firebase live config
        env:
          CONFIG_PATH: ${{ github.workspace }}/firebase-live.json
        run: |
          cat > "$CONFIG_PATH" <<'JSON'
          {
            "hosting": {
              "site": "papajohns-kiosk",
              "public": ".firebase-hosting",
              "ignore": ["**/.*", "**/node_modules/**"]
            }
          }
          JSON

      - name: Validate live target before authentication
        env:
          CONFIG_PATH: ${{ github.workspace }}/firebase-live.json
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          PROJECT_ID: papajohns-kiosk
          SITE_ID: papajohns-kiosk
        run: |
          test "$DEPLOY_CONFIRMATION" = "DEPLOY_PAPAJOHNS_KIOSK_LIVE"
          test "$PROJECT_ID" = "papajohns-kiosk"
          test "$SITE_ID" = "papajohns-kiosk"
          node - "$CONFIG_PATH" <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (config.hosting?.site !== 'papajohns-kiosk') process.exit(1);
          if (config.hosting?.public !== '.firebase-hosting') process.exit(1);
          if (config.hosting?.predeploy || config.hosting?.postdeploy) process.exit(1);
          if (config.functions || config.firestore || config.database || config.storage) process.exit(1);
          NODE

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.24.0 --ignore-scripts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_LIVE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_LIVE_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true

      - name: Print final live deployment summary
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          PROJECT_ID: papajohns-kiosk
          SITE_ID: papajohns-kiosk
        run: |
          test "$DEPLOY_CONFIRMATION" = "DEPLOY_PAPAJOHNS_KIOSK_LIVE"
          FILE_COUNT="$(find .firebase-hosting -type f | wc -l | tr -d ' ')"
          echo "Live deployment target project: $PROJECT_ID"
          echo "Live deployment target Hosting site: $SITE_ID"
          echo "Verified artifact file count: $FILE_COUNT"
          echo "index.html present: yes"
          echo "admin/index.html present: yes"
          echo "Firebase config hooks present: no"
          echo "Deployment confirmation matched: yes"

      - name: Deploy only the Firebase Hosting live site
        env:
          CONFIG_PATH: ${{ github.workspace }}/firebase-live.json
        run: >-
          firebase deploy
          --only hosting:papajohns-kiosk
          --project papajohns-kiosk
          --config "$CONFIG_PATH"
          --non-interactive
