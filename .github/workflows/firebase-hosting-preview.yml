name: Firebase Hosting preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare Firebase Hosting files
        run: npm run build:hosting

      - name: Verify Firebase Hosting files
        run: npm run test:hosting

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy preview channel without changing Authentication domains
        run: >-
          firebase hosting:channel:deploy
          pr-${{ github.event.pull_request.number || 'manual' }}
          --expires 7d
          --no-authorized-domains
          --project papajohns-kiosk
